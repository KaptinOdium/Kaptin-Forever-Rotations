# Priorities compared numerically with MythicSim Forever on 2026-11-06.
# https://api.mythicsim.com/api/forever/rotations
# Mechanics: https://github.com/sage3648/mythicsim-forever-engine (8e9b8df)
# Syntax: https://auth.simia.pro/rotation/
# Self/focus/mouseover casts require their matching macro bindings.
# Simulation reference adapted for leveling and reactive utility; not live-verified.
spec: 11
name: Forever Druid - Cat 1-60
version: 2.3.15
author: Custom
date: '2026-11-17'
patch: Classic Forever
entry: main
description: Feral leveling fallbacks and level-60 Shifting Power, Rip and positional builder priorities.
config:
  setup:
    section: Setup
    type: note
    label: Forever 1-60 and level 60
    text: Uses learned and bound abilities. Damage needs an engaged selected enemy by default. Leave animal form between fights for self-heals, Mark of the Wild and Thorns. Bind the
      self variants for friendly selections.
  start_selected:
    section: Targeting
    type: checkbox
    label: Allow attacks on an idle selected enemy
    default: false
  find_herbs:
    section: Buffs
    type: checkbox
    label: Maintain Find Herbs between fights
    default: true
  maintain_buffs:
    section: Buffs
    type: checkbox
    label: Maintain Mark of the Wild and self Thorns between fights
    default: true
  self_heal:
    section: Between-pull healing
    type: checkbox
    label: Enable between-pull self-healing in caster form
    default: true
  rest_rejuvenation:
    section: Between-pull healing
    type: checkbox
    label: Use Rejuvenation
    default: true
  rest_hp:
    section: Between-pull healing
    type: slider
    label: Rejuvenation below health (%)
    min: 10
    max: 95
    default: 85
  rest_regrowth:
    section: Between-pull healing
    type: checkbox
    label: Use Regrowth while stationary
    default: true
  rest_regrowth_hp:
    section: Between-pull healing
    type: slider
    label: Regrowth below health (%)
    min: 10
    max: 95
    default: 60
  rest_healing_touch:
    section: Between-pull healing
    type: checkbox
    label: Use Healing Touch while stationary
    default: true
  rest_healing_touch_hp:
    section: Between-pull healing
    type: slider
    label: Healing Touch below health (%)
    min: 10
    max: 95
    default: 45
  rest_swiftmend:
    section: Between-pull healing
    type: checkbox
    label: Use Swiftmend below 60% health with your active heal over time
    default: true
  health_pot_hp:
    section: Recovery
    type: slider
    label: Health potion below health (%)
    min: 5
    max: 60
    default: 25
  mana_pot_pct:
    section: Recovery
    type: slider
    label: Mana potion below mana (%)
    min: 0
    max: 50
    default: 20
  use_innervate:
    section: Recovery
    type: checkbox
    label: Use Innervate on yourself at low mana
    default: true
  innervate_pct:
    section: Recovery
    type: slider
    label: Innervate below mana (%)
    min: 5
    max: 60
    default: 25
  use_barkskin:
    section: Defensives
    type: checkbox
    label: Use Barkskin when hurt in combat
    default: true
  barkskin_hp:
    section: Defensives
    type: slider
    label: Barkskin below health (%)
    min: 10
    max: 80
    default: 50
  mouseover_bash:
    section: Mouseover
    type: checkbox
    label: Bash engaged mouseover casts in Bear Form
    default: true
  auto_bash:
    section: Interrupts
    type: checkbox
    label: Bash casts on selected target in Bear Form
    default: true
  rebirth_mouseover:
    section: Mouseover
    type: checkbox
    label: Rebirth a dead friendly mouseover
    default: false
  dispels:
    section: Support
    type: checkbox
    label: Remove Curse and Poison on group in caster form
    default: true
  mana_reserve:
    section: Resources
    type: slider
    label: Mana to retain after damage spells (%)
    min: 0
    max: 50
    default: 15
  cat_info:
    section: Feral
    type: note
    label: Cat leveling and level 60
    text: Uses Bear before Cat is learned, and caster spells before Bear. Pools energy for Shred from behind only when threat confirms the enemy is not tanked by you; Claw covers frontal, tanking or unreadable checks. Clearcasting uses free attacks,
      with a final Bite when the enemy is about to die. Does not leave Cat in combat to heal.
  elunes_light:
    section: Racials
    type: checkbox
    label: 'Night Elf: Elune''s Light on bosses or sustained melee fights'
    default: true
  auto_form:
    section: Feral
    type: checkbox
    label: Enter Cat Form for combat, Bear before Cat is learned
    default: true
  use_shifting_power:
    section: Resources
    type: checkbox
    label: Use Shifting Power when energy is low
    default: true
  leveling_rake:
    section: Feral
    type: checkbox
    label: Maintain Rake on durable enemies
    default: true
  rip_cp:
    section: Feral
    type: slider
    label: Minimum combo points for Rip
    min: 3
    max: 5
    default: 5
  rip_ttd:
    section: Feral
    type: slider
    label: Minimum remaining target life for Rip (seconds)
    min: 6
    max: 20
    default: 10
  respect_demo_shout:
    section: Feral
    type: checkbox
    label: Skip Roar while a warrior Demoralizing Shout is active
    default: true
  demo_shout_note:
    section: Feral
    type: note
    label: Avoid blocked attack-power debuffs
    text: Demoralizing Roar can be blocked by a warrior Demoralizing Shout. By default, skip Roar while any Shout rank is active instead of wasting rage and globals. This does not compare
      ranks or talent strength; disable it if your stronger Roar should replace a weaker Shout.
  early_melee_finish:
    section: "Early leveling mana"
    type: "checkbox"
    label: "Before learning forms: finish weakened mobs with melee"
    default: true
  early_melee_hp:
    section: "Early leveling mana"
    type: "slider"
    label: "Switch to melee below enemy health (%)"
    min: 10
    max: 50
    default: 30
  early_melee_info:
    section: "Early leveling mana"
    type: "note"
    label: "Save mana once weapon swings start"
    text: "Before Bear/Cat/Moonkin Form is learned, finish a weakened engaged enemy already in melee. Requires at least 50% health and no detected extra attackers. Paid damage resumes if the enemy leaves melee; free spells and healing retain their priorities. No automatic movement or target changes."
variables:
  early_caster_stage: "config.early_melee_finish&!action.5487.known&!action.9634.known&!action.768.known&!action.24858.known&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any&player.combat&player.health.pct>=50&enemies.combat.8y<=1&nameplates.threat.count<=1"
  early_melee_finish_active: "var.early_caster_stage&target.exists&target.alive&target.enemy&target.attackable&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)&target.in_melee&!target.boss&target.health.pct>0&target.health.pct<=config.early_melee_hp"
  early_melee_saving: "var.early_melee_finish_active&player.auto_attacking"
  # Form auras may have no caster GUID; always query every source.
  caster_form_active: buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any
  cat_rear: target.in_melee&target.has_world_pos&player.has_world_pos&!target.facing.player
  cat_shred_allowed: var.cat_rear&target.threat>=0&target.threat<2
  cat_builder: combo_points<5|buff.clearcasting.up|((!action.ferocious_bite.known|action.ferocious_bite.blocked)&(!action.rip.known|action.rip.blocked|target.time_to_die<config.rip_ttd))|(energy.deficit<25&(!action.rip.known|action.rip.blocked|dot.rip.remains>2|target.time_to_die<config.rip_ttd))
  demo_shout_present: debuff.1160.up.any|debuff.6190.up.any|debuff.11554.up.any|debuff.11555.up.any|debuff.11556.up.any
lists:
  survival:
  - health_potion,range_check=none,if=player.combat&player.health.pct<=config.health_pot_hp&health_potion.ready
  - barkskin,range_check=none,if=config.use_barkskin&player.combat&player.health.pct<config.barkskin_hp&buff.barkskin.down
  recovery:
  - mana_potion,range_check=none,if=player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&mana.pct<=config.mana_pot_pct&mana_potion.ready
  - innervate.player,range_check=none,if=config.use_innervate&player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&mana.pct<config.innervate_pct&buff.innervate.down.any
  - call_action_list,name=rest_heals,if=config.self_heal&!player.combat&!player.auto_attacking&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any&buff.prowl.down.any
  rest_heals:
  - swiftmend.player,range_check=none,if=config.rest_swiftmend&player.health.effective.pct<60&(buff.rejuvenation.up|buff.regrowth.up)
  - healing_touch.player,range_check=none,if=config.rest_healing_touch&!player.moving&player.health.effective.pct<config.rest_healing_touch_hp
  - regrowth.player,range_check=none,if=config.rest_regrowth&!player.moving&player.health.effective.pct<config.rest_regrowth_hp&buff.regrowth.down.any
  - rejuvenation.player,range_check=none,if=config.rest_rejuvenation&player.health.effective.pct<config.rest_hp&buff.rejuvenation.down.any
  buffs:
  - call_action_list,name=self_mark,if=config.maintain_buffs&!player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.gift_of_the_wild.down.any&(buff.mark_of_the_wild.down.any|(buff.mark_of_the_wild.up&buff.mark_of_the_wild.remains>0&buff.mark_of_the_wild.remains<60))
  - call_action_list,name=self_thorns,if=config.maintain_buffs&!player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&(buff.thorns.down.any|(buff.thorns.up&buff.thorns.remains>0&buff.thorns.remains<30))
  self_mark:
  - mark_of_the_wild,range_check=none,if=!target.exists|target.enemy
  - mark_of_the_wild.player,range_check=none
  self_thorns:
  - thorns,range_check=none,if=!target.exists|target.enemy
  - thorns.player,range_check=none
  control:
  - bash.mouseover,range_check=mouseover,if=config.mouseover_bash&(buff.5487.up.any|buff.9634.up.any)&mouseover.exists&mouseover.enemy&mouseover.alive&mouseover.combat&!mouseover.boss&(mouseover.targeting_party|mouseover.threat>=0)&(mouseover.casting|mouseover.channeling)
  - bash,if=config.auto_bash&(buff.5487.up.any|buff.9634.up.any)&target.exists&target.enemy&target.alive&target.combat&!target.boss&(target.targeting_party|target.threat>=0)&(target.casting|target.channeling)&(target.casting.interruptible|target.incoming_cast.stunnable.up)
  - rebirth.mouseover,range_check=mouseover,if=config.rebirth_mouseover&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&!player.moving&mouseover.exists&mouseover.friendly&mouseover.dead
  dispels:
  - remove_curse,cycle=members,if=config.dispels&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&cycle.range<=30&cycle.dispelable.curse
  - abolish_poison,cycle=members,if=config.dispels&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  - cure_poison,cycle=members,if=config.dispels&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  caster_damage:
  - attack_target,if=var.early_melee_finish_active&!player.auto_attacking
  - moonfire,if=(!var.early_melee_saving|action.moonfire.cost=0)&var.caster_form_active&dot.moonfire.remains<=0&target.time_to_die>=8&(action.moonfire.cost=0|(mana-action.moonfire.cost)*100>=mana.max*config.mana_reserve)
  - wrath,if=(!var.early_melee_saving|action.wrath.cost=0)&var.caster_form_active&!player.moving&(action.wrath.cost=0|(mana-action.wrath.cost)*100>=mana.max*config.mana_reserve)
  - attack_target,if=var.caster_form_active&target.in_melee&!player.auto_attacking
  loot:
  - interact_target,if=target.lootable&target.range<=5
  - interact_mouseover,if=mouseover.lootable&mouseover.range<=5
  main:
  - return,if=!state.rotation|state.blocked_inputs|!player.alive|player.mounted
  - return,if=buff.20580.up.any
  - call_action_list,name=spell_queue
  - return,if=!player.combat&(buff.food.up.any|buff.drink.up.any|buff.nutritious_food.up.any|buff.nutritious_drink.up.any)
  - return,if=player.casting|player.channeling
  - return,if=buff.prowl.up&!player.combat&!config.start_selected
  - call_action_list,name=survival
  - call_action_list,name=control
  - call_action_list,name=recovery
  - call_action_list,name=dispels
  - call_action_list,name=buffs
  - call_action_list,name=loot,if=config.lootnearby&!player.combat&(!target.exists|target.dead)
  - 2383,range_check=none,ignore_usable=true,if=config.find_herbs&action.2383.known&!player.combat&!player.auto_attacking&buff.prowl.down.any&buff.20580.down.any&buff.2383.down.any&buff.8387.down.any&(!config.start_selected|!target.exists|!target.enemy|target.dead)
  - return,if=!(target.exists&target.alive&target.enemy&((player.combat&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking))|(config.start_selected&!player.combat)))
  - cat_form,range_check=none,if=config.auto_form&buff.768.down.any
  - call_action_list,name=cat_combat,if=buff.768.up.any
  - dire_bear_form,range_check=none,if=config.auto_form&!action.768.known&buff.5487.down.any&buff.9634.down.any
  - bear_form,range_check=none,if=config.auto_form&!action.768.known&buff.5487.down.any&buff.9634.down.any
  - call_action_list,name=early_bear,if=(!config.auto_form|!action.768.known|action.cat_form.blocked|mana<action.cat_form.cost)&(buff.5487.up.any|buff.9634.up.any)
  - call_action_list,name=caster_damage,if=buff.5487.down.any&buff.9634.down.any&buff.768.down.any&(!config.auto_form|action.cat_form.blocked|(!action.768.known&(!action.5487.known|action.bear_form.blocked)&(!action.9634.known|action.dire_bear_form.blocked))|mana<action.cat_form.cost|mana<action.bear_form.cost|mana<action.dire_bear_form.cost)
  cat_combat:
  - elunes_light,range_check=none,if=config.elunes_light&state.cds&action.elunes_light.ready&buff.1259799.down.any&target.in_melee&(player.combat|buff.prowl.up)&(target.boss|target.time_to_die>=12)
  - ravage,if=buff.prowl.up&var.cat_rear
  - ferocious_bite,if=target.in_melee&combo_points>=3&target.time_to_die>0&target.time_to_die<3
  - shifting_power,range_check=none,if=config.use_shifting_power&target.in_melee&energy.deficit>=40+5*equipped.8345&(mana-action.shifting_power.cost)*100>=mana.max*config.mana_reserve
  - faerie_fire,if=buff.prowl.down.any&debuff.faerie_fire.remains.any<=1&target.time_to_die>=10
  - rake,if=config.leveling_rake&combo_points<5&dot.rake.remains<=0&(target.time_to_die>=8|(target.time_to_die>=6&action.ferocious_bite.known&!buff.clearcasting.up&energy>=action.rake.cost+action.ferocious_bite.cost))
  - rip,if=combo_points>=config.rip_cp&dot.rip.remains<=0&target.time_to_die>=config.rip_ttd
  - ferocious_bite,if=combo_points>=5&!buff.clearcasting.up&(!action.rip.known|action.rip.blocked|dot.rip.remains>5|target.time_to_die<config.rip_ttd)
  - ferocious_bite,if=combo_points>=3&target.time_to_die>0&target.time_to_die<5&!buff.clearcasting.up
  - shred,if=var.cat_shred_allowed&var.cat_builder
  - claw,if=target.in_melee&var.cat_builder&(!var.cat_shred_allowed|!action.shred.known|action.shred.blocked)
  - attack_target,if=target.in_melee&!player.auto_attacking&buff.prowl.down
  early_bear:
  - demoralizing_roar,range_check=none,if=state.aoe&enemies.8y=enemies.combat.8y&target.in_melee&enemies.combat.8y>=2&debuff.demoralizing_roar.remains.any<=2&(!config.respect_demo_shout|!var.demo_shout_present)
  - swipe,if=state.aoe&enemies.8y=enemies.combat.8y&target.in_melee&enemies.combat.8y>=2&rage>=20
  - maul,if=target.in_melee&rage>=25
  - attack_target,if=target.in_melee&!player.auto_attacking
