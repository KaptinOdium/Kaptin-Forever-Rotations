# Priorities compared numerically with MythicSim Forever on 2026-11-06.
# https://api.mythicsim.com/api/forever/rotations
# Mechanics: https://github.com/sage3648/mythicsim-forever-engine (8e9b8df)
# Syntax: https://auth.simia.pro/rotation/
# Self/focus/mouseover casts require their matching macro bindings.
# Simulation reference adapted for leveling and reactive utility; not live-verified.
spec: 11
name: Forever Druid - Cat 1-60
version: 2.3.20
author: Custom
date: '2026-11-18'
patch: Classic Forever
entry: main
description: Cat leveling and positional attacks, with Bear attacks when you shift to Bear or Dire Bear.
config:
  setup:
    section: Setup
    type: note
    label: Forever 1-60 and level 60
    text: Uses learned and bound abilities. Damage needs an engaged selected enemy by default. Leave animal form between fights for self-heals, Mark of the Wild and Thorns. Bind the
      self variants for friendly selections.
  start_selected:
    section: Targeting
    type: checkbox
    label: Allow attacks on an idle selected enemy
    default: false
  pull_faerie_fire:
    section: Stealth and opener
    type: checkbox
    label: Pull with Faerie Fire out of combat
    description: Requires idle-target attacks under Targeting. Auto Prowl takes priority while you approach in Cat Form. Faerie Fire still refreshes in combat.
    default: false
  auto_prowl:
    section: Stealth and opener
    type: checkbox
    label: Auto Prowl near the selected enemy while in Cat Form
    default: false
  prowl_range:
    section: Stealth and opener
    type: slider
    label: Auto Prowl distance (yards, center to center)
    min: 5
    max: 40
    default: 25
  cat_opener:
    section: Stealth and opener
    type: dropdown
    label: Exclusive stealth opener
    default: 0
    options:
    - label: Ravage
      value: 0
    - label: Pounce
      value: 1
  opener_info:
    section: Stealth and opener
    type: note
    label: Preserve stealth until the chosen opener is available
    text: Approach a selected enemy in Cat Form. Auto Prowl waits for a known distance inside your slider range and holds automatic Cat attacks until Prowl takes effect. Enable idle-target attacks under Targeting if you want the profile to open with your chosen Pounce or Ravage. Both require a rear position and a working bind. You can still start an attack manually.
  war_stomp_interrupt:
    section: Interrupts
    type: checkbox
    label: 'Tauren: War Stomp a casting target or mouseover in Cat/Bear Form'
    default: true
  war_stomp_avoid_pulls:
    section: Interrupts
    type: checkbox
    label: 'War Stomp: avoid extra pulls (AoE off: only a lone detected enemy)'
    default: true
  find_herbs:
    section: Buffs
    type: checkbox
    label: Maintain Find Herbs between fights
    default: true
  maintain_buffs:
    section: Buffs
    type: checkbox
    label: Maintain Mark of the Wild and self Thorns between fights
    default: true
  self_heal:
    section: Between-pull healing
    type: checkbox
    label: Enable between-pull self-healing in caster form
    default: true
  rest_rejuvenation:
    section: Between-pull healing
    type: checkbox
    label: Use Rejuvenation
    default: true
  rest_hp:
    section: Between-pull healing
    type: slider
    label: Rejuvenation below health (%)
    min: 10
    max: 95
    default: 85
  rest_regrowth:
    section: Between-pull healing
    type: checkbox
    label: Use Regrowth while stationary
    default: true
  rest_regrowth_hp:
    section: Between-pull healing
    type: slider
    label: Regrowth below health (%)
    min: 10
    max: 95
    default: 60
  rest_healing_touch:
    section: Between-pull healing
    type: checkbox
    label: Use Healing Touch while stationary
    default: true
  rest_healing_touch_hp:
    section: Between-pull healing
    type: slider
    label: Healing Touch below health (%)
    min: 10
    max: 95
    default: 45
  rest_swiftmend:
    section: Between-pull healing
    type: checkbox
    label: Use Swiftmend below 60% health with your active heal over time
    default: true
  combat_self_heal:
    section: Combat self-healing
    type: checkbox
    label: Heal in combat after I manually leave animal form
    default: false
  combat_regrowth_hp:
    section: Combat self-healing
    type: slider
    label: Swiftmend or missing Regrowth below effective health (%)
    min: 10
    max: 90
    default: 50
  combat_healing_touch_hp:
    section: Combat self-healing
    type: slider
    label: Healing Touch below effective health (%)
    min: 10
    max: 90
    default: 65
  combat_rejuvenation_hp:
    section: Combat self-healing
    type: slider
    label: Missing Rejuvenation below effective health (%)
    min: 10
    max: 95
    default: 80
  combat_heal_info:
    section: Combat self-healing
    type: note
    label: Manual combat forms and caster self-heals
    text: You change forms manually during combat. Cat and Bear keep attacking. Caster form heals, recovers mana and dispels, then waits without offensive casts or starting auto-attacks. Hard casts require standing still. Active HoTs are not reapplied. Thresholds include incoming heals and healing absorbs. Bind @player heals. Between-pull healing and form entry stay separate.
  health_pot_hp:
    section: Recovery
    type: slider
    label: Health potion below health (%)
    min: 5
    max: 60
    default: 25
  mana_pot_pct:
    section: Recovery
    type: slider
    label: Mana potion below mana (%)
    min: 0
    max: 50
    default: 20
  use_innervate:
    section: Recovery
    type: checkbox
    label: Use Innervate on yourself at low mana
    default: true
  innervate_pct:
    section: Recovery
    type: slider
    label: Innervate below mana (%)
    min: 5
    max: 60
    default: 25
  use_barkskin:
    section: Defensives
    type: checkbox
    label: Use Barkskin when hurt in combat
    default: true
  barkskin_hp:
    section: Defensives
    type: slider
    label: Barkskin below health (%)
    min: 10
    max: 80
    default: 50
  mouseover_bash:
    section: Mouseover
    type: checkbox
    label: Bash engaged mouseover casts in Bear Form
    default: true
  auto_bash:
    section: Interrupts
    type: checkbox
    label: Bash casts on selected target in Bear Form
    default: true
  rebirth_mouseover:
    section: Mouseover
    type: checkbox
    label: Rebirth a dead friendly mouseover
    default: false
  dispels:
    section: Support
    type: checkbox
    label: Remove Curse and Poison on group in caster form
    default: true
  mana_reserve:
    section: Resources
    type: slider
    label: Mana to retain after damage spells (%)
    min: 0
    max: 50
    default: 15
  cat_info:
    section: Feral
    type: note
    label: Cat leveling and level 60
    text: Stay on this profile when you change forms. Cat uses Shred from behind and Claw from the front. Bear and Dire Bear use Bear attacks until you switch back. Automatic form entry can take you from caster form into Cat, or Bear before Cat is learned. Turn it off to control every shift yourself.
  conservative_shred:
    section: Feral
    type: checkbox
    label: Use Claw while tanking or threat is unknown (workaround)
    default: false
  conservative_shred_info:
    section: Feral
    type: note
    label: Optional workaround for repeated behind-target errors
    text: Off by default. If enabled, Shred also requires known non-tanking threat. This can skip valid rear Shreds in PvP and against casting or stunned enemies. It does not repair loader positioning or detect a server rejection.
  elunes_light:
    section: Racials
    type: checkbox
    label: 'Night Elf: Elune''s Light on bosses or sustained melee fights'
    default: true
  auto_form:
    section: Feral
    type: checkbox
    label: From caster form, enter Cat for combat or Bear before Cat is learned
    default: true
  use_shifting_power:
    section: Resources
    type: checkbox
    label: Use Shifting Power when energy is low
    default: true
  leveling_rake:
    section: Feral
    type: checkbox
    label: Maintain Rake on durable enemies
    default: true
  rip_cp:
    section: Feral
    type: slider
    label: Minimum combo points for Rip
    min: 3
    max: 5
    default: 5
  rip_ttd:
    section: Feral
    type: slider
    label: Minimum remaining target life for Rip (seconds)
    min: 6
    max: 20
    default: 10
  respect_demo_shout:
    section: Feral
    type: checkbox
    label: Skip Roar while a warrior Demoralizing Shout is active
    default: true
  demo_shout_note:
    section: Feral
    type: note
    label: Avoid blocked attack-power debuffs
    text: Demoralizing Roar can be blocked by a warrior Demoralizing Shout. By default, skip Roar while any Shout rank is active instead of wasting rage and globals. This does not compare
      ranks or talent strength; disable it if your stronger Roar should replace a weaker Shout.
  early_melee_finish:
    section: "Early leveling mana"
    type: "checkbox"
    label: "Before learning forms: finish weakened mobs with melee"
    default: true
  early_melee_hp:
    section: "Early leveling mana"
    type: "slider"
    label: "Switch to melee below enemy health (%)"
    min: 10
    max: 50
    default: 30
  early_melee_info:
    section: "Early leveling mana"
    type: "note"
    label: "Save mana once weapon swings start"
    text: "Before Bear/Cat/Moonkin Form is learned, finish a weakened engaged enemy already in melee. Requires at least 50% health and no detected extra attackers. Paid damage resumes if the enemy leaves melee; free spells and healing retain their priorities. No automatic movement or target changes."
variables:
  auto_form_allowed: config.auto_form&(!config.combat_self_heal|!player.combat)
  prowl_approach: config.auto_prowl&buff.768.up.any&!player.combat&!player.auto_attacking&buff.prowl.down.any&target.exists&target.enemy&target.alive&target.attackable&player.has_world_pos&target.has_world_pos&target.distance<=config.prowl_range
  cat_opening_allowed: target.exists&target.alive&target.enemy&target.attackable&((player.combat&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking))|(config.start_selected&!player.combat))
  selected_stun_cast: target.exists&target.enemy&target.alive&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)&!target.boss&(target.casting|target.channeling)&(target.casting.interruptible|target.incoming_cast.stunnable.up)
  hover_stun_cast: mouseover.exists&mouseover.enemy&mouseover.alive&mouseover.combat&(mouseover.targeting_party|mouseover.threat>=0)&!mouseover.boss&(mouseover.casting|mouseover.channeling)&(mouseover.casting.interruptible|mouseover.incoming_cast.stunnable.up)
  stomp_area_clear: '!config.war_stomp_avoid_pulls|(state.aoe&enemies.combat.8y>0&enemies.8y=enemies.combat.8y)|(!state.aoe&player.has_world_pos&enemies.around.angle.180.8=1)'
  early_caster_stage: "config.early_melee_finish&!action.5487.known&!action.9634.known&!action.768.known&!action.24858.known&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any&player.combat&player.health.pct>=50&enemies.combat.8y<=1&nameplates.threat.count<=1"
  early_melee_finish_active: "var.early_caster_stage&target.exists&target.alive&target.enemy&target.attackable&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)&target.in_melee&!target.boss&target.health.pct>0&target.health.pct<=config.early_melee_hp"
  early_melee_saving: "var.early_melee_finish_active&player.auto_attacking"
  # Form auras may have no caster GUID; always query every source.
  caster_form_active: buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any
  cat_rear: target.in_melee&target.has_world_pos&player.has_world_pos&!target.facing.player
  cat_shred_allowed: var.cat_rear&(!config.conservative_shred|(target.threat>=0&target.threat<2))
  cat_builder: combo_points<5|buff.clearcasting.up|((!action.ferocious_bite.known|action.ferocious_bite.blocked)&(!action.rip.known|action.rip.blocked|target.time_to_die<config.rip_ttd))|(energy.deficit<25&(!action.rip.known|action.rip.blocked|dot.rip.remains>2|target.time_to_die<config.rip_ttd))
  demo_shout_present: debuff.1160.up.any|debuff.6190.up.any|debuff.11554.up.any|debuff.11555.up.any|debuff.11556.up.any
  bear_lacerate_due: target.in_melee&(target.time_to_die<=0|target.time_to_die>=6)&(debuff.lacerate.stack<5|(dot.lacerate.remains>0&dot.lacerate.remains<=4.5))
  bear_maul_filler: debuff.lacerate.stack<5|!action.primal_bite.known|action.primal_bite.blocked
  bear_swipe_pack: state.aoe&target.in_melee&enemies.8y=enemies.combat.8y&enemies.combat.8y>=2
lists:
  survival:
  - health_potion,range_check=none,if=player.combat&player.health.pct<=config.health_pot_hp&health_potion.ready
  - barkskin,range_check=none,if=config.use_barkskin&player.combat&player.health.pct<config.barkskin_hp&buff.barkskin.down
  recovery:
  - mana_potion,range_check=none,if=player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&mana.pct<=config.mana_pot_pct&mana_potion.ready
  - innervate.player,range_check=none,if=config.use_innervate&player.combat&var.caster_form_active&mana.pct<config.innervate_pct&buff.innervate.down.any
  - call_action_list,name=rest_heals,if=config.self_heal&!player.combat&!player.auto_attacking&var.caster_form_active&buff.prowl.down.any
  rest_heals:
  - swiftmend.player,range_check=none,if=config.rest_swiftmend&player.health.effective.pct<60&(buff.rejuvenation.up|buff.regrowth.up)
  - healing_touch.player,range_check=none,if=config.rest_healing_touch&!player.moving&player.health.effective.pct<config.rest_healing_touch_hp
  - regrowth.player,range_check=none,if=config.rest_regrowth&!player.moving&player.health.effective.pct<config.rest_regrowth_hp&buff.regrowth.down.any
  - rejuvenation.player,range_check=none,if=config.rest_rejuvenation&player.health.effective.pct<config.rest_hp&buff.rejuvenation.down.any
  combat_heals:
  - swiftmend.player,range_check=none,if=player.health.effective.pct<config.combat_regrowth_hp&(buff.rejuvenation.up|buff.regrowth.up)
  - regrowth.player,range_check=none,if=!player.moving&player.health.effective.pct<config.combat_regrowth_hp&buff.regrowth.down.any
  - healing_touch.player,range_check=none,if=!player.moving&player.health.effective.pct<config.combat_healing_touch_hp
  - rejuvenation.player,range_check=none,if=player.health.effective.pct<config.combat_rejuvenation_hp&buff.rejuvenation.down.any
  buffs:
  - call_action_list,name=self_mark,if=config.maintain_buffs&!player.combat&var.caster_form_active&buff.gift_of_the_wild.down.any&(buff.mark_of_the_wild.down.any|(buff.mark_of_the_wild.up&buff.mark_of_the_wild.remains>0&buff.mark_of_the_wild.remains<60))
  - call_action_list,name=self_thorns,if=config.maintain_buffs&!player.combat&var.caster_form_active&(buff.thorns.down.any|(buff.thorns.up&buff.thorns.remains>0&buff.thorns.remains<30))
  self_mark:
  - mark_of_the_wild,range_check=none,if=!target.exists|target.enemy
  - mark_of_the_wild.player,range_check=none
  self_thorns:
  - thorns,range_check=none,if=!target.exists|target.enemy
  - thorns.player,range_check=none
  control:
  - bash.mouseover,range_check=mouseover,if=config.mouseover_bash&(buff.5487.up.any|buff.9634.up.any)&mouseover.exists&mouseover.enemy&mouseover.alive&mouseover.combat&!mouseover.boss&(mouseover.targeting_party|mouseover.threat>=0)&(mouseover.casting|mouseover.channeling)
  - bash,if=config.auto_bash&(buff.5487.up.any|buff.9634.up.any)&target.exists&target.enemy&target.alive&target.combat&!target.boss&(target.targeting_party|target.threat>=0)&(target.casting|target.channeling)&(target.casting.interruptible|target.incoming_cast.stunnable.up)
  - war_stomp,range_check=none,if=config.war_stomp_interrupt&player.combat&(buff.768.up.any|buff.5487.up.any|buff.9634.up.any)&buff.prowl.down.any&action.war_stomp.ready&!player.moving&var.stomp_area_clear&((var.selected_stun_cast&target.distance<=8&target.casting.remains>0.6)|(var.hover_stun_cast&mouseover.distance<=8&mouseover.casting.remains>0.6))
  - rebirth.mouseover,range_check=mouseover,if=config.rebirth_mouseover&var.caster_form_active&!player.moving&mouseover.exists&mouseover.friendly&mouseover.dead
  dispels:
  - remove_curse,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.curse
  - abolish_poison,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  - cure_poison,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  caster_damage:
  - attack_target,if=var.early_melee_finish_active&!player.auto_attacking
  - moonfire,if=(!var.early_melee_saving|action.moonfire.cost=0)&var.caster_form_active&dot.moonfire.remains<=0&target.time_to_die>=8&(action.moonfire.cost=0|(mana-action.moonfire.cost)*100>=mana.max*config.mana_reserve)
  - wrath,if=(!var.early_melee_saving|action.wrath.cost=0)&var.caster_form_active&!player.moving&(action.wrath.cost=0|(mana-action.wrath.cost)*100>=mana.max*config.mana_reserve)
  - attack_target,if=var.caster_form_active&target.in_melee&!player.auto_attacking
  loot:
  - interact_target,delay=350,if=target.lootable&target.range<=5
  - interact_mouseover,delay=350,if=mouseover.lootable&mouseover.range<=5
  - interact_target,range_check=none,delay=350,if=!target.exists&loot_nearby
  main:
  - return,if=!state.rotation|state.blocked_inputs|!player.alive|player.mounted
  - return,if=buff.20580.up.any
  - call_action_list,name=spell_queue
  - return,if=!player.combat&(buff.food.up.any|buff.drink.up.any|buff.nutritious_food.up.any|buff.nutritious_drink.up.any)
  - return,if=player.casting|player.channeling
  - prowl,range_check=none,line_cd=2,if=var.prowl_approach
  - run_action_list,name=cat_opening,if=buff.768.up.any&buff.prowl.up.any
  - return,if=buff.prowl.up.any
  - call_action_list,name=survival
  - call_action_list,name=control
  - call_action_list,name=recovery
  - call_action_list,name=combat_heals,if=config.combat_self_heal&player.combat&var.caster_form_active
  - call_action_list,name=dispels
  - return,if=config.combat_self_heal&player.combat&var.caster_form_active
  - call_action_list,name=buffs
  - call_action_list,name=loot,if=config.lootnearby&!player.combat&!player.auto_attacking&buff.prowl.down.any&buff.20580.down.any&(!target.exists|target.dead)
  - 2383,range_check=none,ignore_usable=true,if=config.find_herbs&action.2383.known&!player.combat&!player.auto_attacking&buff.prowl.down.any&buff.20580.down.any&buff.2383.down.any&buff.8387.down.any&(!config.start_selected|!target.exists|!target.enemy|target.dead)
  - return,if=!(target.exists&target.alive&target.enemy&((player.combat&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking))|(config.start_selected&!player.combat)))
  - cat_form,range_check=none,if=var.auto_form_allowed&var.caster_form_active
  - call_action_list,name=cat_combat,if=buff.768.up.any
  - dire_bear_form,range_check=none,if=var.auto_form_allowed&var.caster_form_active&!action.768.known
  - bear_form,range_check=none,if=var.auto_form_allowed&var.caster_form_active&!action.768.known
  - call_action_list,name=early_bear,if=buff.5487.up.any|buff.9634.up.any
  - call_action_list,name=caster_damage,if=buff.5487.down.any&buff.9634.down.any&buff.768.down.any&(!config.auto_form|action.cat_form.blocked|(!action.768.known&(!action.5487.known|action.bear_form.blocked)&(!action.9634.known|action.dire_bear_form.blocked))|mana<action.cat_form.cost|mana<action.bear_form.cost|mana<action.dire_bear_form.cost)
  cat_combat:
  - run_action_list,name=cat_opening,if=buff.prowl.up.any
  - return,if=config.auto_prowl&!player.combat&!player.auto_attacking
  - elunes_light,range_check=none,if=config.elunes_light&state.cds&action.elunes_light.ready&buff.1259799.down.any&target.in_melee&(player.combat|buff.prowl.up)&(target.boss|target.time_to_die>=12)
  - ferocious_bite,if=target.in_melee&combo_points>=3&target.time_to_die>0&target.time_to_die<3
  - shifting_power,range_check=none,if=config.use_shifting_power&target.in_melee&energy.deficit>=40+5*equipped.8345&(mana-action.shifting_power.cost)*100>=mana.max*config.mana_reserve
  - faerie_fire,if=(player.combat|(config.pull_faerie_fire&target.attackable))&buff.prowl.down.any&debuff.faerie_fire.remains.any<=1&target.time_to_die>=10
  - rake,if=config.leveling_rake&combo_points<5&dot.rake.remains<=0&(target.time_to_die>=8|(target.time_to_die>=6&action.ferocious_bite.known&!buff.clearcasting.up&energy>=action.rake.cost+action.ferocious_bite.cost))
  - rip,if=combo_points>=config.rip_cp&dot.rip.remains<=0&target.time_to_die>=config.rip_ttd
  - ferocious_bite,if=combo_points>=5&!buff.clearcasting.up&(!action.rip.known|action.rip.blocked|dot.rip.remains>5|target.time_to_die<config.rip_ttd)
  - ferocious_bite,if=combo_points>=3&target.time_to_die>0&target.time_to_die<5&!buff.clearcasting.up
  - shred,if=var.cat_shred_allowed&var.cat_builder
  - claw,if=target.in_melee&var.cat_builder&(!var.cat_shred_allowed|!action.shred.known|action.shred.blocked)
  - attack_target,if=target.in_melee&!player.auto_attacking&buff.prowl.down
  cat_opening:
  - return,if=!var.cat_opening_allowed
  - pounce,if=config.cat_opener=1&buff.prowl.up.any&var.cat_rear
  - ravage,if=config.cat_opener=0&buff.prowl.up.any&var.cat_rear
  - return
  early_bear:
  - attack_target,if=target.in_melee&!player.auto_attacking&buff.frenzied_regeneration.up&rage<40
  - run_action_list,name=bear_regen_free,if=buff.frenzied_regeneration.up&rage<40
  - demoralizing_roar,range_check=none,if=state.aoe&enemies.8y=enemies.combat.8y&target.in_melee&enemies.combat.8y>=2&debuff.demoralizing_roar.remains.any<=2&(!config.respect_demo_shout|!var.demo_shout_present)
  - lacerate,if=var.bear_lacerate_due&rage>=action.lacerate.cost
  - swipe,if=var.bear_swipe_pack&rage>=action.swipe.cost
  - primal_bite,if=target.in_melee&rage>=action.primal_bite.cost
  - maul,if=target.in_melee&var.bear_maul_filler&(rage>=25|(buff.clearcasting.up&action.maul.cost=0))&rage>=action.maul.cost&buff.frenzied_regeneration.down
  - attack_target,if=target.in_melee&!player.auto_attacking
  bear_regen_free:
  - lacerate,if=var.bear_lacerate_due&buff.clearcasting.up&action.lacerate.cost=0
  - swipe,if=var.bear_swipe_pack&buff.clearcasting.up&action.swipe.cost=0
  - primal_bite,if=target.in_melee&buff.clearcasting.up&action.primal_bite.cost=0
