# Forever Paladin profiles, updated 2026-11-17. Simia class-id schema (Paladin=2).
# Source mechanics: https://github.com/sage3648/mythicsim-forever-engine
# Syntax: https://auth.simia.pro/rotation/
# Requires learned spell bindings; .player/.mouseover are explicit macro variants.
# Deliberately no auto_target list: selecting an idle mob alone does not pull it.
# Taunts use Seal of Fury + Judgement, not retail Provoke/Hand of Reckoning.
# See ../README.md for targeting limits and what has actually been verified.
spec: 2
name: Forever Paladin - Protection 1-60
version: 2.7.4
author: Custom
date: '2026-11-17'
patch: Classic Forever
entry: main
movement_allowed: false
description: Protection leveling and level-60 priorities; current Forever mechanics with mana and support controls.
config:
  overview:
    section: 01 - Setup
    type: note
    label: Protection / levels 1-60
    text: Train and bind learned spells; unavailable spells are skipped. Select this profile for this role. Self Might/Wisdom, healing and mouseover variants need their own Simia bindings.
      Does not automatically select or pull enemies. The endgame priorities follow current Forever mechanics; they are not a personal gear simulation.
  maintain_buffs:
    section: 02 - Buffs
    type: checkbox
    label: Maintain self aura and blessing
    value: true
    default: true
  use_wisdom:
    section: 02 - Buffs
    type: checkbox
    label: Use Wisdom on self; otherwise Might
    value: true
    default: true
  party_buffs:
    section: 02 - Buffs
    type: checkbox
    label: Party Wisdom for healers / Might for physical DPS
    value: false
    default: false
  party_buff_note:
    section: 02 - Buffs
    type: note
    label: Party buff assignment
    text: Automatic party buffing is off until party1-party4 blessing bindings are set. Wisdom is assigned to healer-role members. Might is assigned only to a manually selected physical-DPS
      list; it is not applied to every DPS caster. Existing normal or Greater Might/Wisdom from any Paladin is left in place, including other ranks. This fills missing blessings; it
      does not upgrade or replace another Paladin's blessing.
  might_targets:
    section: 02 - Buffs
    type: unit_select
    label: Party members for Might
    filter: dps
    max: 4
  mouseover_stun:
    section: 03 - Mouseover and control
    type: checkbox
    label: Hammer of Justice on hovered enemy casts
    value: true
    default: true
  auto_stun:
    section: 03 - Mouseover and control
    type: checkbox
    label: Also stun selected enemy interruptible casts
    value: false
    default: false
  stun_note:
    section: 03 - Mouseover and control
    type: note
    label: Hover control
    text: Hovering an engaged non-boss enemy in range casts the stun only while it is casting or channeling. Turn off the checkbox to reserve it. Stuns do not work on every enemy; no
      automatic crowd-control pull is made.
  self_freedom:
    section: 04 - Support
    type: checkbox
    label: Freedom on self when rooted
    value: true
    default: true
  cleanse:
    section: 04 - Support
    type: checkbox
    label: Self cleanse / purify
    value: true
    default: true
  group_cleanse:
    section: 04 - Support
    type: checkbox
    label: Cleanse party or raid members
    value: false
    default: false
  support_bop:
    section: 04 - Support
    type: checkbox
    label: Emergency Protection on low-health healer
    value: false
    default: false
  bop_hp:
    section: 04 - Support
    type: slider
    label: Healer Protection below health (%)
    min: 5
    max: 50
    value: 25
    default: 25
  bop_note:
    section: 04 - Support
    type: note
    label: Protection is physical immunity
    text: Optional low-health fallback, not an attacker detector. It blocks physical damage; it does not stop magical damage. Never targets tanks. Check role assignments and bindings.
  mouseover_res:
    section: 04 - Support
    type: checkbox
    label: Resurrect dead friendly mouseover between fights
    value: false
    default: false
  self_heal:
    section: 05 - Healing and survival
    type: checkbox
    label: Self healing
    value: true
    default: true
  heal_hp:
    section: 05 - Healing and survival
    type: slider
    label: Combat self-heal below health (%)
    min: 5
    max: 80
    value: 30
    default: 30
  rest_hp:
    section: 05 - Healing and survival
    type: slider
    label: 'Between pulls: heal below health (%)'
    min: 30
    max: 100
    value: 85
    default: 85
  lay_on_hands:
    section: 05 - Healing and survival
    type: checkbox
    label: Emergency Lay on Hands
    value: true
    default: true
  loh_hp:
    section: 05 - Healing and survival
    type: slider
    label: Lay on Hands below health (%)
    min: 5
    max: 35
    value: 15
    default: 15
  bubble:
    section: 05 - Healing and survival
    type: checkbox
    label: Solo emergency Divine Shield / Protection (never in groups)
    value: false
    default: false
  bubble_hp:
    section: 05 - Healing and survival
    type: slider
    label: Immunity below health (%)
    min: 5
    max: 25
    value: 12
    default: 12
  solo_bubble_heal:
    section: 05a - Solo bubble recovery
    type: checkbox
    label: 'Solo: bubble then heal; Lay on Hands fallback'
    value: false
    default: false
  solo_bubble_hp:
    section: 05a - Solo bubble recovery
    type: slider
    label: Start solo bubble recovery below health (%)
    min: 5
    max: 50
    value: 30
    default: 30
  solo_bubble_heal_to:
    section: 05a - Solo bubble recovery
    type: slider
    label: Heal inside bubble up to health (%)
    min: 40
    max: 95
    value: 70
    default: 70
  solo_bubble_note:
    section: 05a - Solo bubble recovery
    type: note
    label: Optional solo recovery only
    text: Uses Divine Shield or Divine Protection before Lay on Hands when enough mana remains for a usable heal. Includes its own self-healing, even if ordinary self-healing or tank
      hard-cast healing is off. Never runs in dungeons or raids, or with living groupmates. The loader cannot detect a party containing only dead/offline allies. Bind Holy Light @player,
      Flash of Light @player and Holy Shock @player when learned. Lay on Hands retains its own checkbox and threshold. Group/tank emergency settings are unchanged.
  health_items:
    section: 06 - Mana and consumables
    type: checkbox
    label: Use tracked healing potion / healthstone
    value: true
    default: true
  health_item_hp:
    section: 06 - Mana and consumables
    type: slider
    label: Healing item below health (%)
    min: 5
    max: 60
    value: 30
    default: 30
  health_item_note:
    section: 06 - Mana and consumables
    type: note
    label: Healing items before emergency cooldowns
    text: When not casting, ready healing potions and Healthstones are tried before solo bubble recovery and Lay on Hands. Unavailable items are skipped without waiting. Health is checked
      again on the next evaluation; Lay on Hands remains available at its own threshold if an item was not enough. Items do not cancel a heal already casting; emergency spells can still
      interrupt an unsafe cast. The optional solo bubble sequence stays disabled in dungeons and raids.
  mana_items:
    section: 06 - Mana and consumables
    type: checkbox
    label: Use tracked mana potion in combat
    value: true
    default: true
  mana_item_pct:
    section: 06 - Mana and consumables
    type: slider
    label: Mana potion below mana (%)
    min: 5
    max: 50
    value: 20
    default: 20
  mana_floor:
    section: 06 - Mana and consumables
    type: slider
    label: Mana reserve after damage spells (%)
    min: 0
    max: 80
    value: 15
    default: 15
  racial_human:
    section: 07 - Racials
    type: checkbox
    label: 'Human: Will to Survive when stunned'
    value: true
    default: true
  racial_dwarf:
    section: 07 - Racials
    type: checkbox
    label: 'Dwarf: Stoneform for cleanse / emergency armor'
    value: true
    default: true
  racial_undead:
    section: 07 - Racials
    type: checkbox
    label: 'Undead: Will of the Forsaken for fear / charm'
    value: true
    default: true
  racial_note:
    section: 07 - Racials
    type: note
    label: Only learned racials can cast
    text: Passive racials require no action. Cannibalize remains manual; normal channels are protected from rotation interruption.
  consecration:
    section: 08a - Area damage
    type: checkbox
    label: Consecration with AoE enabled
    value: true
    default: true
  consecration_targets:
    section: 08a - Area damage
    type: slider
    label: Consecration combat enemies within 8 yards
    min: 1
    max: 8
    value: 2
    default: 2
  stationary_consecration:
    section: 08a - Area damage
    type: checkbox
    label: Only drop Consecration while stationary
    value: true
    default: true
  consecration_mana:
    section: 08a - Area damage
    type: slider
    label: Consecration minimum mana (%)
    min: 10
    max: 90
    value: 40
    default: 40
  damage:
    section: 08 - Damage
    type: checkbox
    label: Damage selected engaged enemy
    value: true
    default: true
  maintain_rf:
    section: 02 - Buffs
    type: checkbox
    label: Maintain Righteous Fury, including before pulls
    value: true
    default: true
  taunt_note:
    section: 03 - Mouseover and control
    type: note
    label: Taunt is Seal of Fury + Judgement
    text: Mouseover taunt sets Fury, then Judges that enemy; Swift Judgement is the cooldown fallback. Automatic recovery covers the selected non-boss enemy targeting a party member,
      including a healer. Both modes avoid bosses, raids and another assigned tank by default. The separate hover override is for deliberate swaps. It cannot scan a whole pack or identify
      which enemy targets the healer. Select or hover the enemy to recover it.
  mouseover_taunt:
    section: 03 - Mouseover and control
    type: checkbox
    label: Mouseover taunt an enemy attacking someone else
    value: true
    default: true
  auto_taunt:
    section: 03 - Mouseover and control
    type: checkbox
    label: Recover selected non-boss enemy attacking party
    value: true
    default: true
  mouseover_taunt_override:
    section: 03 - Mouseover and control
    type: checkbox
    label: Allow hover taunts on bosses / raids / with another tank
    value: false
    default: false
  protect_cc:
    section: 03a - Crowd-control safety
    type: checkbox
    label: Preserve breakable crowd control
    value: true
    default: true
  cc_note:
    section: 03a - Crowd-control safety
    type: note
    label: Known crowd-control auras only
    text: Avoids new damage and taunts on a sheeped, sapped, sleeping, shackled, frozen, blinded, gouged or Repentance target. Any such visible enemy suppresses new Consecration, even
      outside its radius. Existing ground damage and autoattacks are not cancelled. Only verified aura IDs are covered; hidden enemies or new custom control spells may not be detected.
  urgent_healer_cleanse:
    section: 04 - Support
    type: checkbox
    label: Prioritize healer magic CC when group cleansing is enabled
    value: true
    default: true
  healer_support_note:
    section: 04 - Support
    type: note
    label: Urgent healer support
    text: When enabled, healer Protection precedes taunt preparation and routine heals, but your emergency survival comes first. It avoids existing immunities and Forbearance from any
      source. Protection is still health-based physical protection, not an attacker detector. With group cleansing enabled, verified Polymorph, Fear, Hammer of Justice and Freezing Trap
      auras on healers get urgent Cleanse. This requires the existing group spell bindings and assigned healer roles. New or hidden control auras are not guaranteed.
  bulwark:
    section: 05 - Healing and survival
    type: checkbox
    label: Use Templar's Bulwark
    value: true
    default: true
  bulwark_hp:
    section: 05 - Healing and survival
    type: slider
    label: Bulwark below health (%)
    min: 10
    max: 80
    value: 40
    default: 40
  pressure_bulwark:
    section: 05 - Healing and survival
    type: checkbox
    label: Use Bulwark earlier under multiple attackers
    value: true
    default: true
  bulwark_attackers:
    section: 05 - Healing and survival
    type: slider
    label: 'Earlier Bulwark: minimum attackers'
    min: 2
    max: 10
    value: 4
    default: 4
  bulwark_pressure_hp:
    section: 05 - Healing and survival
    type: slider
    label: Earlier Bulwark at or below health (%)
    min: 20
    max: 80
    value: 55
    default: 55
  pressure_note:
    section: 05 - Healing and survival
    type: note
    label: Pressure is visible attacker activity
    text: Requires the configured number of visible noncasting enemies attacking you. It works even with damage AoE off. It is a conservative pressure signal, not an exact damage forecast.
      The main Bulwark toggle still controls both rules. Existing Bulwark, Forbearance or immunity prevents another defensive overlap.
  combat_healing:
    section: 05 - Healing and survival
    type: checkbox
    label: Allow emergency hard-cast self-heal while tanking
    value: false
    default: false
  reserve_holy_shield:
    section: 06 - Mana and consumables
    type: checkbox
    label: Reserve mana for Holy Shield due within one GCD
    value: true
    default: true
  shieldsworn_mana_recovery:
    section: 06 - Mana and consumables
    type: checkbox
    label: 'I have Shieldsworn: allow Holy Strike below damage mana floor'
    value: false
    default: false
  shieldsworn_note:
    section: 06 - Mana and consumables
    type: note
    label: Learned-talent setting
    text: Enable only after learning Shieldsworn. While tanking in melee with Holy Shield active, Holy Strike may bypass the ordinary damage mana floor. It still needs enough current
      mana, and preserves a pending taunt and an affordable shield refresh. No future mana proc is counted in the budget. The loader does not reliably expose this passive talent automatically.
  melee_finish:
    section: 06 - Mana and consumables
    type: checkbox
    label: Save mana by melee-finishing a nearly dead single enemy
    value: true
    default: true
  melee_finish_hp:
    section: 06 - Mana and consumables
    type: slider
    label: 'Melee finish: enemy health at or below (%)'
    min: 1
    max: 20
    value: 10
    default: 10
  melee_finish_ttd:
    section: 06 - Mana and consumables
    type: slider
    label: 'Melee finish: estimated life at most (seconds)'
    min: 1
    max: 5
    value: 3
    default: 3
  melee_finish_note:
    section: 06 - Mana and consumables
    type: note
    label: Conservative single-enemy finish
    text: Only with one nearby engaged non-boss enemy, secure target threat, autoattacks running, your effective health at least 60%, and a positive short life estimate. Skips ordinary
      damage spending; active-shield Holy Strike, defense, interrupts and rescue remain available. Requires AoE enabled to obtain an accurate enemy count. Never activates in raids or
      on unknown life estimates. Disable for maximum immediate damage.
  tank_budget_note:
    section: 06 - Mana and consumables
    type: note
    label: Defensive and rescue budgets
    text: Optional damage preserves an affordable Holy Shield refresh and a pending Fury Judgement. Disabled or unlearned spells do not hold mana. Emergency mitigation, potions and Lay
      on Hands remain available.
  consecration_stand_time:
    section: 08a - Area damage
    type: slider
    label: 'Consecration: seconds standing still'
    min: 0
    max: 3
    value: 0
    default: 0
  consecration_min_ttd:
    section: 08a - Area damage
    type: slider
    label: 'Single enemy: minimum life for Consecration (seconds)'
    min: 0
    max: 20
    value: 6
    default: 6
  prioritize_pack_threat:
    section: 08a - Area damage
    type: checkbox
    label: Prioritize safe pack Consecration over ordinary damage
    value: true
    default: true
  tank_aoe_note:
    section: 08a - Area damage
    type: note
    label: Pack threat and mana
    text: Keeps Holy Shield and its Holy Strike interaction first, then prioritizes safe Consecration. The life estimate only restricts a single enemy; a dying selected mob never suppresses
      pack AoE. Nonpositive estimates are ignored. Existing target-count, mana and stationary options still apply. Set standing seconds to zero for immediate casting when stopped.
  tank_damage_seal:
    section: 08 - Damage
    type: checkbox
    label: Use simulator Righteousness damage seal instead of Fury
    value: false
    default: false
  fury_damage_judgement:
    section: 08 - Damage
    type: checkbox
    label: Spend Fury Judgement for damage while already tanking
    value: false
    default: false
  instant_tank_damage:
    section: 08 - Damage
    type: checkbox
    label: Skip cast-time Hammer of Wrath while actively tanking
    value: false
    default: false
  execute_note:
    section: 08 - Damage
    type: note
    label: Avoid wasted execute casts
    text: Hammer of Wrath requires the enemy life estimate to exceed its cast time plus a small margin; instant casts and nonpositive estimates remain allowed. The optional instant-only
      rule also avoids starting it while tanking nearby enemies. This does not change emergency healing settings.
  tank_seal_note:
    section: 08 - Damage
    type: note
    label: Tanking versus damage simulation
    text: The published P5 Prot damage preset uses Righteousness. Fury is the safer tank default here. Fury Judgement is reserved for rescue by default; enable its damage option to spend
      it while already tanking. Enable the damage seal when appropriate; a rescue still switches to Fury before taunting. Holy Shield stays above Holy Strike for Shieldsworn.
  predict_consecration:
    section: 08a - Area damage
    type: checkbox
    label: Predict whether enemies will stay in Consecration (experimental)
    value: false
    default: false
  movement_note:
    section: 08a - Area damage
    type: note
    label: Moving, stopping and chasing
    text: Instant attacks and seals remain available while moving. Cast-time attacks and ordinary hard-cast heals wait until stopped. Stationary Consecration respects the standing-time
      setting; zero adds no delay. Optional prediction also requires the configured enemy count and at least 75% of nearby enemies to remain within 8 yards in two seconds. This is a
      movement estimate, not guaranteed ground-effect uptime. Leave it off if world-position data is unavailable. Skipping Consecration does not pause other abilities or defenses.
  use_exorcism:
    section: 08 - Damage
    type: checkbox
    label: Exorcism filler against engaged undead / demons
    value: true
    default: true
  shock_damage:
    section: 08 - Damage
    type: checkbox
    label: Spend Holy Shock on damage when healthy (shares healing cooldown)
    value: false
    default: false
  spell_damage_note:
    section: 08 - Damage
    type: note
    label: Learned ranged damage spells
    text: Uses normal Exorcism and Holy Shock bindings when learned. They follow core attacks and obey the damage mana reserve. Exorcism only targets undead or demons. Optional Holy
      Shock damage requires at least 80% effective health and consumes the same cooldown as its heal. Neither option pulls an idle selected enemy. Cast-time versions require standing
      still.
  aura_mode:
    section: 02 - Buffs
    type: dropdown
    label: Preferred aura
    options:
    - label: Devotion Aura
      value: 0
    - label: Retribution Aura
      value: 1
    - label: Fire Resistance Aura
      value: 2
    - label: Frost Resistance Aura
      value: 3
    - label: Shadow Resistance Aura
      value: 4
    - label: Concentration Aura
      value: 5
    - label: Manual
      value: 6
    default: 0
    value: 0
  aura_note:
    section: 02 - Buffs
    type: note
    label: Aura preference
    text: Devotion is the default. An unlearned preference falls back to Devotion only when no rank of that preferred aura is active. A learned aura keeps its preference when disabled
      or unbound. Existing ranks from any Paladin are respected. Manual leaves aura changes to you; automatic blessings still follow their own settings.
  self_blessing_mode:
    section: 02 - Buffs
    type: dropdown
    label: Self blessing preference
    default: 0
    value: 0
    options:
    - label: Existing Might / Wisdom setting
      value: 0
    - label: Might
      value: 1
    - label: Wisdom
      value: 2
    - label: Kings
      value: 3
    - label: Manual
      value: 4
  self_blessing_note:
    section: 02 - Buffs
    type: note
    label: Self blessing assignment
    text: The default follows the existing Wisdom setting. Explicit Wisdom or Kings falls back to Might only before that spell is learned. A learned preference does not switch blessings
      when disabled, unbound or unavailable. Learned-rank checks and observed preferred buffs prevent fallback switching. Existing ranks from any Paladin are respected, and Freedom or
      Protection is preserved. Manual keeps your current blessing; aura maintenance and party buffing still follow their own settings. Automatic self blessings require Maintain self
      aura and blessing and the existing explicit self spell binding; no bindings are changed.
  judgement_assignment:
    section: 08b - Long-fight Judgement
    type: dropdown
    label: Assigned debuff on long fights
    default: 0
    value: 0
    options:
    - label: None / manual
      value: 0
    - label: Crusader - Holy damage
      value: 1
    - label: Wisdom - mana support
      value: 2
  judgement_setup_ttd:
    section: 08b - Long-fight Judgement
    type: slider
    label: Minimum remaining target life after observation (seconds)
    min: 20
    max: 120
    default: 30
    value: 30
  judgement_assignment_note:
    section: 08b - Long-fight Judgement
    type: note
    label: One assignment; budget the complete sequence
    text: Optional, off by default. Wait for at least 3 seconds of player combat and for the selected enemy to reach 95% health or less. Its remaining life estimate must be positive,
      below 9999 seconds and at least the configured minimum. Normal damage continues while setup is ineligible; this does not pause the rotation. On a safe, engaged target in Judgement
      range, apply the assigned seal, Judge it, then return to the preferred damage/tank seal. Skips existing assigned debuffs from any Paladin, including other ranks. Requires enough
      current mana for all three actions plus the damage reserve. Protection additionally requires secure selected-target threat, no rescue pending and no shield refresh due. Unknown
      target life, short pulls, unavailable spells and emergency support take precedence. Coordinate the assignment with other Paladins. This is not an automatic best-debuff selector
      or a proven universal timing threshold.
variables:
  engaged: player.combat&target.exists&target.enemy&target.alive&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)
  self_heal_needed: config.self_heal&((player.combat&player.health.effective.pct<config.heal_hp)|(!player.combat&player.health.effective.pct<config.rest_hp))
  safe_aoe: state.aoe&target.in_melee&enemies.combat.8y>=config.consecration_targets&enemies.8y=enemies.combat.8y&!var.visible_cc&!var.target_cc
  self_forbearance: player.debuff.forbearance.up.any|player.debuff.25771.up.any
  temporary_blessing: buff.blessing_of_protection.up.any|buff.blessing_of_freedom.up.any
  solo_recovery: config.solo_bubble_heal&!player.indungeon&!player.inraid&group.count(!cycle.is_player)=0
  solo_immune: buff.divine_shield.up|buff.divine_protection.up
  solo_recovering: var.solo_recovery&var.solo_immune&player.health.pct<config.solo_bubble_heal_to
  solo_heal_in_progress: var.solo_recovery&var.solo_immune&(player.casting.holy_light|player.casting.flash_of_light)&(buff.divine_shield.remains>player.casting.remains+0.3|buff.divine_protection.remains>player.casting.remains+0.3)
  solo_holy_light: action.holy_light.ready&!player.moving
  solo_holy_light_fits: var.solo_holy_light&(buff.divine_shield.remains>gcd.remains+action.holy_light.cast_time+0.3|buff.divine_protection.remains>gcd.remains+action.holy_light.cast_time+0.3)
  solo_flash_of_light: action.flash_of_light.ready&!player.moving
  solo_flash_of_light_fits: var.solo_flash_of_light&(buff.divine_shield.remains>gcd.remains+action.flash_of_light.cast_time+0.3|buff.divine_protection.remains>gcd.remains+action.flash_of_light.cast_time+0.3)
  solo_holy_shock: action.holy_shock.ready
  solo_holy_shock_fits: var.solo_holy_shock&(buff.divine_shield.remains>gcd.remains+action.holy_shock.cast_time+0.3|buff.divine_protection.remains>gcd.remains+action.holy_shock.cast_time+0.3)
  solo_divine_shield_budget: (var.solo_holy_light&mana>=action.divine_shield.cost+action.holy_light.cost&action.divine_shield.duration>action.divine_shield.execute_time+action.holy_light.cast_time+0.3)|(var.solo_flash_of_light&mana>=action.divine_shield.cost+action.flash_of_light.cost&action.divine_shield.duration>action.divine_shield.execute_time+action.flash_of_light.cast_time+0.3)|(var.solo_holy_shock&mana>=action.divine_shield.cost+action.holy_shock.cost&action.divine_shield.duration>action.divine_shield.execute_time+action.holy_shock.cast_time+0.3)
  solo_divine_protection_budget: (var.solo_holy_light&mana>=action.divine_protection.cost+action.holy_light.cost&action.divine_protection.duration>action.divine_protection.execute_time+action.holy_light.cast_time+0.3)|(var.solo_flash_of_light&mana>=action.divine_protection.cost+action.flash_of_light.cost&action.divine_protection.duration>action.divine_protection.execute_time+action.flash_of_light.cast_time+0.3)|(var.solo_holy_shock&mana>=action.divine_protection.cost+action.holy_shock.cost&action.divine_protection.duration>action.divine_protection.execute_time+action.holy_shock.cast_time+0.3)
  solo_heal_fits: var.solo_holy_light_fits|var.solo_flash_of_light_fits|var.solo_holy_shock_fits
  self_known_wisdom: action.blessing_of_wisdom.known|action.19742.known|action.19850.known|action.19852.known|action.19853.known|action.19854.known|action.25290.known
