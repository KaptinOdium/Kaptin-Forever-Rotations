# Reviewed against current MythicSim Forever presets on 2026-11-05.
# https://api.mythicsim.com/api/forever/rotations
# Mechanics: https://github.com/sage3648/mythicsim-forever-engine (8e9b8df)
# Syntax: https://auth.simia.pro/rotation/
# Self/focus/mouseover casts require their matching macro bindings.
# Simulation reference adapted for leveling and reactive utility; not live-verified.
spec: 11
name: Forever Druid - Bear 1-60
version: 2.3.20
author: Custom
date: '2026-11-18'
patch: Classic Forever
entry: main
description: Shield-free tank leveling, threat recovery and level-60 mitigation/damage priorities.
config:
  setup:
    section: Setup
    type: note
    label: Forever 1-60 and level 60
    text: 'Uses learned and bound abilities. Damage needs an engaged selected enemy by default. Bind self/focus/mouseover variants with the companion binding helper. No automatic target
      cycling. Mark of the Wild and Thorns require caster form: leave Bear Form between fights to refresh them. This profile never deliberately cancels a tanking form.'
  start_selected:
    section: Targeting
    type: checkbox
    label: Allow attacks on an idle selected enemy
    default: false
  find_herbs:
    section: Buffs
    type: checkbox
    label: Maintain Find Herbs between fights
    default: true
  maintain_buffs:
    section: Buffs
    type: checkbox
    label: Maintain Mark of the Wild and self Thorns between fights
    default: true
  self_heal:
    section: Between-pull healing
    type: checkbox
    label: Enable between-pull self-healing in caster form
    default: true
  rest_rejuvenation:
    section: Between-pull healing
    type: checkbox
    label: Use Rejuvenation
    default: true
  rest_rejuvenation_hp:
    section: Between-pull healing
    type: slider
    label: Rejuvenation below health (%)
    min: 10
    max: 95
    default: 85
  rest_regrowth:
    section: Between-pull healing
    type: checkbox
    label: Use Regrowth while stationary
    default: true
  rest_regrowth_hp:
    section: Between-pull healing
    type: slider
    label: Regrowth below health (%)
    min: 10
    max: 95
    default: 60
  rest_healing_touch:
    section: Between-pull healing
    type: checkbox
    label: Use Healing Touch while stationary
    default: true
  rest_healing_touch_hp:
    section: Between-pull healing
    type: slider
    label: Healing Touch below health (%)
    min: 10
    max: 95
    default: 45
  rest_swiftmend:
    section: Between-pull healing
    type: checkbox
    label: Use Swiftmend below 60% health with your active heal over time
    default: true
  health_pot_hp:
    section: Recovery
    type: slider
    label: Health potion below health (%)
    min: 5
    max: 60
    default: 25
  mana_pot_pct:
    section: Recovery
    type: slider
    label: Mana potion below mana (%)
    min: 0
    max: 50
    default: 20
  use_innervate:
    section: Recovery
    type: checkbox
    label: Use Innervate on yourself at low mana
    default: true
  innervate_pct:
    section: Recovery
    type: slider
    label: Innervate below mana (%)
    min: 5
    max: 60
    default: 25
  use_barkskin:
    section: Defensives
    type: checkbox
    label: Use Barkskin when hurt in combat
    default: true
  barkskin_hp:
    section: Defensives
    type: slider
    label: Barkskin below health (%)
    min: 10
    max: 80
    default: 50
  mouseover_bash:
    section: Mouseover
    type: checkbox
    label: Bash engaged mouseover casts in Bear Form
    default: true
  auto_bash:
    section: Interrupts
    type: checkbox
    label: Bash casts on selected target in Bear Form
    default: true
  war_stomp_interrupt:
    section: Interrupts
    type: checkbox
    label: 'Tauren: War Stomp a casting target or mouseover in Bear Form'
    default: true
  war_stomp_avoid_pulls:
    section: Interrupts
    type: checkbox
    label: 'War Stomp: avoid extra pulls (AoE off: only a lone detected enemy)'
    default: true
  elunes_light:
    section: Racials
    type: checkbox
    label: 'Night Elf: Elune''s Light on bosses or sustained melee fights'
    default: true
  resting_shadowmeld:
    section: Racials
    type: checkbox
    label: 'Night Elf: Shadowmeld while eating or drinking between fights'
    default: false
  mouseover_moonfire:
    section: Mouseover
    type: checkbox
    label: Moonfire on a hovered enemy fighting your group (caster form)
    default: true
  rebirth_mouseover:
    section: Mouseover
    type: checkbox
    label: Rebirth a dead friendly mouseover
    default: false
  dispels:
    section: Support
    type: checkbox
    label: Remove Curse and Poison on group in caster form
    default: true
  mana_reserve:
    section: Resources
    type: slider
    label: Mana to retain after damage spells (%)
    min: 0
    max: 50
    default: 15
  skyborne_leyline:
    section: Racials
    type: checkbox
    label: 'Alliance Skyborne: Read Leyline between fights at 75% health or mana'
    default: true
  skyborne_skysight:
    section: Racials
    type: checkbox
    label: 'Horde Skyborne: use Skysight after two seconds of travel between fights'
    default: false
  tank_info:
    section: Tanking
    type: note
    label: Selected and focus threat recovery
    text: Auto Growl checks selected enemy and enemy focus that are attacking the party with known threat below tanking. Includes healer attackers when selected/focused; it cannot scan
      and select every healer attacker. Boss taunts are opt-in to preserve raid assignments.
  auto_form:
    section: Tanking
    type: checkbox
    label: Enter Bear Form for combat
    default: true
  auto_growl:
    section: Tanking
    type: checkbox
    label: Recover selected target attacking the group
    default: true
  raid_taunt:
    section: Tanking
    type: checkbox
    label: Allow automatic threat recovery in raids / with another assigned tank
    default: false
  focus_growl:
    section: Tanking
    type: checkbox
    label: Recover enemy focus attacking the group
    default: true
  mouseover_growl:
    section: Mouseover
    type: checkbox
    label: Growl an engaged mouseover enemy
    default: true
  boss_taunt:
    section: Tanking
    type: checkbox
    label: Allow automatic boss taunts
    default: false
  frenzied_hp:
    section: Defensives
    type: slider
    label: Frenzied Regeneration below health (%)
    min: 10
    max: 70
    default: 35
  demo:
    section: Tanking
    type: checkbox
    label: Maintain Demoralizing Roar on sustained fights
    default: true
  swipe_targets:
    section: Area Damage
    type: slider
    label: Swipe minimum engaged nearby enemies
    min: 2
    max: 6
    default: 2
  maul_rage:
    section: Resources
    type: slider
    label: Maul rage threshold
    min: 10
    max: 90
    default: 10
  use_enrage:
    section: Resources
    type: checkbox
    label: Use Enrage when not attacked (over 90% health, under 20 rage)
    default: false
  respect_demo_shout:
    section: Tanking
    type: checkbox
    label: Skip Roar while a warrior Demoralizing Shout is active
    default: true
  demo_shout_note:
    section: Tanking
    type: note
    label: Avoid blocked attack-power debuffs
    text: Demoralizing Roar can be blocked by a warrior Demoralizing Shout. By default, skip Roar while any Shout rank is active instead of wasting rage and globals. This does not compare
      ranks or talent strength; disable it if your stronger Roar should replace a weaker Shout.
  early_melee_finish:
    section: "Early leveling mana"
    type: "checkbox"
    label: "Before learning forms: finish weakened mobs with melee"
    default: true
  early_melee_hp:
    section: "Early leveling mana"
    type: "slider"
    label: "Switch to melee below enemy health (%)"
    min: 10
    max: 50
    default: 30
  early_melee_info:
    section: "Early leveling mana"
    type: "note"
    label: "Save mana once weapon swings start"
    text: "Before Bear/Cat/Moonkin Form is learned, finish a weakened engaged enemy already in melee. Requires at least 50% health and no detected extra attackers. Paid damage resumes if the enemy leaves melee; free spells and healing retain their priorities. No automatic movement or target changes."
variables:
  early_caster_stage: "config.early_melee_finish&!action.5487.known&!action.9634.known&!action.768.known&!action.24858.known&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any&player.combat&player.health.pct>=50&enemies.combat.8y<=1&nameplates.threat.count<=1"
  early_melee_finish_active: "var.early_caster_stage&target.exists&target.alive&target.enemy&target.attackable&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)&target.in_melee&!target.boss&target.health.pct>0&target.health.pct<=config.early_melee_hp"
  early_melee_saving: "var.early_melee_finish_active&player.auto_attacking"
  early_hover_melee_saving: "var.early_caster_stage&player.auto_attacking&mouseover.exists&mouseover.alive&mouseover.enemy&mouseover.attackable&mouseover.combat&(mouseover.targeting_party|mouseover.threat>=0)&mouseover.in_melee&!mouseover.boss&mouseover.health.pct>0&mouseover.health.pct<=config.early_melee_hp"
  # Form auras may have no caster GUID; always query every source.
  caster_form_active: buff.5487.down.any&buff.9634.down.any&buff.768.down.any&buff.24858.down.any&buff.783.down.any&buff.1066.down.any
  bear_form_active: buff.5487.up.any|buff.9634.up.any
  resting: '!player.combat&(buff.food.up.any|buff.drink.up.any|buff.nutritious_food.up.any|buff.nutritious_drink.up.any)'
  selected_fighting_group: target.exists&target.enemy&target.alive&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking)
  hover_fighting_group: mouseover.exists&mouseover.enemy&mouseover.alive&mouseover.combat&(mouseover.targeting_party|mouseover.threat>=0)
  selected_stun_cast: var.selected_fighting_group&!target.boss&(target.casting|target.channeling)&(target.casting.interruptible|target.incoming_cast.stunnable.up)
  hover_stun_cast: var.hover_fighting_group&!mouseover.boss&(mouseover.casting|mouseover.channeling)&(mouseover.casting.interruptible|mouseover.incoming_cast.stunnable.up)
  stomp_area_clear: '!config.war_stomp_avoid_pulls|(state.aoe&enemies.combat.8y>0&enemies.8y=enemies.combat.8y)|(!state.aoe&player.has_world_pos&enemies.around.angle.180.8=1)'
  demo_shout_present: debuff.1160.up.any|debuff.6190.up.any|debuff.11554.up.any|debuff.11555.up.any|debuff.11556.up.any
  bear_lacerate_due: target.in_melee&(target.time_to_die<=0|target.time_to_die>=6)&(debuff.lacerate.stack<5|(dot.lacerate.remains>0&dot.lacerate.remains<=4.5))
  bear_maul_filler: debuff.lacerate.stack<5|!action.primal_bite.known|action.primal_bite.blocked
  bear_swipe_pack: state.aoe&target.in_melee&enemies.8y=enemies.combat.8y&enemies.combat.8y>=config.swipe_targets
lists:
  prepare_bear:
  - enrage,range_check=none,if=config.use_enrage&rage<20&player.health.pct>90&buff.enrage.down
  survival:
  - health_potion,range_check=none,if=player.combat&player.health.pct<=config.health_pot_hp&health_potion.ready
  - barkskin,range_check=none,if=config.use_barkskin&player.combat&player.health.pct<config.barkskin_hp&buff.barkskin.down
  - frenzied_regeneration,range_check=none,if=(buff.5487.up.any|buff.9634.up.any)&player.combat&player.health.pct<config.frenzied_hp&rage>=10&buff.frenzied_regeneration.down
  recovery:
  - mana_potion,range_check=none,if=player.combat&buff.5487.down.any&buff.9634.down.any&buff.768.down.any&mana.pct<=config.mana_pot_pct&mana_potion.ready
  - innervate.player,range_check=none,if=config.use_innervate&player.combat&var.caster_form_active&mana.pct<config.innervate_pct&buff.innervate.down.any
  - call_action_list,name=rest_heals,if=config.self_heal&!player.combat&!player.auto_attacking&var.caster_form_active&buff.prowl.down.any
  rest_heals:
  - swiftmend.player,range_check=none,if=config.rest_swiftmend&player.health.effective.pct<60&(buff.rejuvenation.up|buff.regrowth.up)
  - healing_touch.player,range_check=none,if=config.rest_healing_touch&!player.moving&player.health.effective.pct<config.rest_healing_touch_hp
  - regrowth.player,range_check=none,if=config.rest_regrowth&!player.moving&player.health.effective.pct<config.rest_regrowth_hp&buff.regrowth.down.any
  - rejuvenation.player,range_check=none,if=config.rest_rejuvenation&player.health.effective.pct<config.rest_rejuvenation_hp&buff.rejuvenation.down.any
  buffs:
  - call_action_list,name=self_mark,if=config.maintain_buffs&!player.combat&var.caster_form_active&!buff.gift_of_the_wild.up.any&(!buff.mark_of_the_wild.up.any|(buff.mark_of_the_wild.up&buff.mark_of_the_wild.remains>0&buff.mark_of_the_wild.remains<60))
  - call_action_list,name=self_thorns,if=config.maintain_buffs&!player.combat&var.caster_form_active&(!buff.thorns.up.any|(buff.thorns.up&buff.thorns.remains>0&buff.thorns.remains<30))
  self_mark:
  - mark_of_the_wild,range_check=none,if=!target.exists|target.enemy
  - mark_of_the_wild.player,range_check=none
  self_thorns:
  - thorns,range_check=none,if=!target.exists|target.enemy
  - thorns.player,range_check=none
  control:
  - call_action_list,name=stuns,if=player.combat&var.bear_form_active
  - rebirth.mouseover,range_check=mouseover,if=config.rebirth_mouseover&var.caster_form_active&!player.moving&mouseover.exists&mouseover.friendly&mouseover.dead
  - growl.mouseover,range_check=mouseover,if=config.mouseover_growl&(buff.5487.up.any|buff.9634.up.any)&mouseover.exists&mouseover.enemy&mouseover.alive&mouseover.combat&(mouseover.targeting_party|mouseover.threat>=0)&mouseover.threat<2
  - growl.focus,range_check=focus,if=config.focus_growl&((!player.inraid&group.count(cycle.tank&!cycle.is_player)=0)|config.raid_taunt)&(buff.5487.up.any|buff.9634.up.any)&focus.exists&focus.enemy&focus.alive&focus.combat&focus.targeting_party&focus.threat>=0&focus.threat<2&(!focus.boss|config.boss_taunt)
  - growl,if=config.auto_growl&((!player.inraid&group.count(cycle.tank&!cycle.is_player)=0)|config.raid_taunt)&(buff.5487.up.any|buff.9634.up.any)&target.exists&target.enemy&target.alive&target.combat&target.targeting_party&target.threat>=0&target.threat<2&(!target.boss|config.boss_taunt)
  skyborne:
  - read_leyline,range_check=none,ignore_movement=true,if=config.skyborne_leyline&action.read_leyline.ready&buff.innervate.down.any&buff.1270842.down.any&(player.health.pct<=75|(mana.max>0&mana.pct<=75))
  - skysight,range_check=none,ignore_movement=true,if=config.skyborne_skysight&action.skysight.ready&player.moving&player.moving.time>=2&buff.1259688.down.any
  dispels:
  - remove_curse,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.curse
  - abolish_poison,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  - cure_poison,cycle=members,if=config.dispels&var.caster_form_active&cycle.range<=30&cycle.dispelable.poison&cycle.buff.abolish_poison.down&!cycle.buff.abolish_poison.up.any
  caster_damage:
  - attack_target,if=var.early_melee_finish_active&!player.auto_attacking
  - moonfire,if=(!var.early_melee_saving|action.moonfire.cost=0)&var.caster_form_active&dot.moonfire.remains<=0&target.time_to_die>=8&(action.moonfire.cost=0|(mana-action.moonfire.cost)*100>=mana.max*config.mana_reserve)
  - wrath,if=(!var.early_melee_saving|action.wrath.cost=0)&var.caster_form_active&!player.moving&(action.wrath.cost=0|(mana-action.wrath.cost)*100>=mana.max*config.mana_reserve)
  - attack_target,if=var.caster_form_active&target.in_melee&!player.auto_attacking
  stuns:
  - bash.mouseover,range_check=mouseover,if=config.mouseover_bash&mouseover.in_melee&var.hover_stun_cast
  - bash,if=config.auto_bash&target.in_melee&var.selected_stun_cast
  - war_stomp,range_check=none,if=config.war_stomp_interrupt&action.war_stomp.ready&!player.moving&var.stomp_area_clear&((var.selected_stun_cast&target.distance<=8&target.casting.remains>0.6)|(var.hover_stun_cast&mouseover.distance<=8&mouseover.casting.remains>0.6))
  loot:
  - interact_target,if=target.lootable&target.range<=5
  - interact_mouseover,if=mouseover.lootable&mouseover.range<=5
  main:
  - return,if=!state.rotation|state.blocked_inputs|!player.alive|player.mounted
  - return,if=buff.20580.up.any
  - call_action_list,name=spell_queue
  - shadowmeld,range_check=none,if=config.resting_shadowmeld&var.resting&!player.moving&!player.casting&!player.channeling&!player.auto_attacking&buff.prowl.down.any&action.shadowmeld.ready
  - return,if=var.resting
  - return,if=player.casting|player.channeling
  - return,if=buff.prowl.up&!player.combat&!config.start_selected
  - call_action_list,name=survival
  - call_action_list,name=control
  - call_action_list,name=recovery
  - call_action_list,name=skyborne,if=!player.combat&!player.auto_attacking&buff.prowl.down.any&(!config.start_selected|!target.exists|!target.enemy|target.dead)
  - call_action_list,name=dispels
  - call_action_list,name=buffs
  - call_action_list,name=prepare_bear,if=!player.combat&!player.auto_attacking&var.bear_form_active
  - call_action_list,name=loot,if=config.lootnearby&!player.combat&(!target.exists|target.dead)
  - 2383,range_check=none,ignore_usable=true,if=config.find_herbs&action.2383.known&!player.combat&!player.auto_attacking&buff.prowl.down.any&buff.20580.down.any&buff.2383.down.any&buff.8387.down.any&(!config.start_selected|!target.exists|!target.enemy|target.dead)
  - moonfire.mouseover,range_check=mouseover,if=(!var.early_hover_melee_saving|action.moonfire.cost=0)&config.mouseover_moonfire&player.combat&!var.bear_form_active&buff.768.down.any&buff.783.down.any&buff.1066.down.any&buff.prowl.down.any&var.hover_fighting_group&mouseover.attackable&mouseover.debuff.moonfire.down&(action.moonfire.cost=0|(mana-action.moonfire.cost)*100>=mana.max*config.mana_reserve)
  - return,if=!(target.exists&target.alive&target.enemy&((player.combat&target.combat&(target.targeting_party|target.threat>=0|player.auto_attacking))|(config.start_selected&!player.combat)))
  - call_action_list,name=caster_damage,if=!target.in_melee&buff.5487.down.any&buff.9634.down.any&buff.768.down.any
  - dire_bear_form,range_check=none,if=config.auto_form&buff.9634.down.any&buff.5487.down.any&buff.783.down.any&buff.1066.down.any
  - bear_form,range_check=none,if=config.auto_form&buff.9634.down.any&buff.5487.down.any&buff.783.down.any&buff.1066.down.any
  - call_action_list,name=bear_combat,if=(buff.5487.up.any|buff.9634.up.any)
  - call_action_list,name=caster_damage,if=target.in_melee&buff.5487.down.any&buff.9634.down.any&buff.768.down.any
  bear_combat:
  - attack_target,if=target.in_melee&!player.auto_attacking&buff.frenzied_regeneration.up&rage<40
  - call_action_list,name=bear_regen_free,if=buff.frenzied_regeneration.up&rage<40
  - return,if=buff.frenzied_regeneration.up&rage<40
  - elunes_light,range_check=none,if=config.elunes_light&state.cds&action.elunes_light.ready&buff.1259799.down.any&player.combat&var.selected_fighting_group&target.in_melee&(target.boss|target.time_to_die>=12)
  - enrage,range_check=none,if=config.use_enrage&rage<20&nameplates.threat.count=0&player.health.pct>90&buff.enrage.down
  - faerie_fire,if=debuff.faerie_fire.remains.any<=2&target.time_to_die>=8
  - demoralizing_roar,range_check=none,if=config.demo&state.aoe&enemies.8y=enemies.combat.8y&target.in_melee&debuff.demoralizing_roar.remains.any<=2&(target.boss|target.time_to_die>=12|enemies.combat.8y>=2)&(!config.respect_demo_shout|!var.demo_shout_present)
  - lacerate,if=var.bear_lacerate_due&rage>=action.lacerate.cost
  - swipe,if=var.bear_swipe_pack&rage>=action.swipe.cost&(debuff.lacerate.stack>=5|rage-action.swipe.cost>=10|buff.clearcasting.up|((!action.primal_bite.known|action.primal_bite.blocked)&(!action.lacerate.known|action.lacerate.blocked)))
  - primal_bite,if=target.in_melee&rage>=action.primal_bite.cost
  - maul,if=target.in_melee&var.bear_maul_filler&(rage>=config.maul_rage|(buff.clearcasting.up&action.maul.cost=0))&rage>=action.maul.cost&buff.frenzied_regeneration.down
  - attack_target,if=target.in_melee&!player.auto_attacking
  bear_regen_free:
  - elunes_light,range_check=none,if=config.elunes_light&state.cds&action.elunes_light.ready&buff.1259799.down.any&player.combat&var.selected_fighting_group&target.in_melee&(target.boss|target.time_to_die>=12)
  - faerie_fire,if=debuff.faerie_fire.remains.any<=2&target.time_to_die>=8
  - lacerate,if=var.bear_lacerate_due&buff.clearcasting.up&action.lacerate.cost=0
  - swipe,if=var.bear_swipe_pack&buff.clearcasting.up&action.swipe.cost=0
  - primal_bite,if=target.in_melee&buff.clearcasting.up&action.primal_bite.cost=0
